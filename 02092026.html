<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --gold-bright: #fce881;
            --gold-main: #d4af37;
            --gold-dark: #8c6d23;
            --gold-shadow: rgba(212, 175, 55, 0.35);
            --bg-deep: #05060a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: #e5dcc5;
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .vignette-layer {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 25%, rgba(3, 4, 8, 0.7) 70%, #020204 100%);
            pointer-events: none;
            z-index: 10;
        }

        .canvas-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.1) 0%, rgba(139, 0, 0, 0.04) 50%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 2;
            animation: pulse-aura 9s ease-in-out infinite alternate;
        }

        @keyframes pulse-aura {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.85;
            }
        }

        .font-cinzel {
            font-family: 'Cinzel Decorative', serif;
        }

        .font-cormorant {
            font-family: 'Cormorant Garamond', serif;
        }

        .font-modern {
            font-family: 'Montserrat', sans-serif;
        }

        .gold-digit {
            background: linear-gradient(180deg, #ffffff 0%, #fff1a8 25%, #dfb443 60%, #99751e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(230, 190, 70, 0.4));
        }

        .gold-subtext {
            color: #d8c28c;
            letter-spacing: 0.25em;
            text-shadow: 0 0 10px rgba(216, 194, 140, 0.3);
        }

        #ghosts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .ghost-logo {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.85) rotate(var(--rot, 0deg));
            transition: opacity 2.5s ease-in-out, transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.35));
        }

        .ghost-logo.visible {
            opacity: 0.12;
            transform: scale(1.05) rotate(var(--rot-end, 0deg));
        }

        .ghost-logo.fading {
            opacity: 0;
            transform: scale(1.15) rotate(var(--rot-end, 0deg));
        }

        .music-widget-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .music-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 7px 22px 7px 7px;
            background: rgba(8, 10, 16, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 9999px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.25);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom right;
            cursor: pointer;
            user-select: none;
            transform: translate(calc(100% - 62px), calc(100% - 62px));
        }

        .music-card:hover,
        .music-card:focus-within,
        .music-card.expanded {
            transform: translate(0, 0);
            border-color: rgba(212, 175, 55, 0.85);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.4);
        }

        .cover-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.6s ease;
        }

        .music-card:hover .cover-img {
            transform: rotate(20deg) scale(1.08);
        }

        .equalizer-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .eq-bar {
            width: 2.5px;
            background: linear-gradient(180deg, #fff1a8, #d4af37);
            border-radius: 2px;
            height: 3px;
            transition: height 0.2s ease;
        }

        .playing .eq-bar:nth-child(1) {
            animation: eq-pulse 0.85s ease-in-out infinite alternate;
        }

        .playing .eq-bar:nth-child(2) {
            animation: eq-pulse 0.65s ease-in-out infinite alternate 0.15s;
        }

        .playing .eq-bar:nth-child(3) {
            animation: eq-pulse 1s ease-in-out infinite alternate 0.3s;
        }

        .playing .eq-bar:nth-child(4) {
            animation: eq-pulse 0.75s ease-in-out infinite alternate 0.2s;
        }

        @keyframes eq-pulse {
            0% {
                height: 3px;
            }

            100% {
                height: 12px;
            }
        }

        .farewell-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.9s ease;
        }

        .farewell-overlay.active {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .farewell-backdrop {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(14, 16, 26, 0.96) 0%, rgba(4, 5, 8, 0.98) 75%, #020204 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        .farewell-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            transform: translateY(20px) scale(0.95);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .farewell-overlay.active .farewell-content {
            transform: translateY(0) scale(1);
        }

        .farewell-logo-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .farewell-glow-pulse {
            position: absolute;
            inset: -35px;
            background: radial-gradient(circle, rgba(245, 218, 129, 0.4) 0%, rgba(212, 175, 55, 0.18) 50%, transparent 70%);
            filter: blur(35px);
            animation: farewell-aura 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .farewell-logo-inner {
            animation: farewell-float 3.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 35px rgba(245, 218, 129, 0.65)) drop-shadow(0 0 75px rgba(212, 175, 55, 0.35));
        }

        .farewell-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2.2rem, 5.5vw, 3.8rem);
            font-weight: 700;
            letter-spacing: 0.22em;
            background: linear-gradient(180deg, #ffffff 0%, #fff1a8 30%, #dfb443 70%, #99751e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(230, 190, 70, 0.5));
            margin-bottom: 0.75rem;
            animation: farewell-text-glow 2.5s ease-in-out infinite alternate;
        }

        .farewell-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.15rem, 2.8vw, 1.5rem);
            color: #e5dcc5;
            opacity: 0.9;
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        .farewell-loader-track {
            width: 220px;
            height: 3px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .farewell-loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #99751e, #dfb443, #fff1a8);
            box-shadow: 0 0 14px rgba(245, 218, 129, 0.9);
            border-radius: 9999px;
            transition: width 4.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .farewell-overlay.active .farewell-loader-bar {
            width: 100%;
        }

        @keyframes farewell-float {
            0% {
                transform: translateY(0) rotate(-2deg) scale(0.98);
            }

            100% {
                transform: translateY(-14px) rotate(2deg) scale(1.04);
            }
        }

        @keyframes farewell-aura {
            0% {
                transform: scale(0.85);
                opacity: 0.45;
            }

            100% {
                transform: scale(1.25);
                opacity: 0.9;
            }
        }

        @keyframes farewell-text-glow {
            0% {
                filter: drop-shadow(0 0 15px rgba(230, 190, 70, 0.3));
            }

            100% {
                filter: drop-shadow(0 0 32px rgba(230, 190, 70, 0.75));
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4 py-8">

    <div id="farewell-overlay" class="farewell-overlay" aria-hidden="true">
        <div class="farewell-backdrop"></div>
        <div class="farewell-content">
            <div class="farewell-logo-wrapper">
                <div class="farewell-glow-pulse"></div>
                <div class="farewell-logo-inner" id="farewell-logo-slot"></div>
            </div>
            <h2 class="farewell-title">Au revoir</h2>
            <p class="farewell-subtitle">Merci d'avoir utilisé ETU 1, j'espère qu'il vous a été bien utile<br>
                Redirection vers le Site ETU 2!</p>
            <div class="farewell-loader-track">
                <div class="farewell-loader-bar"></div>
            </div>
        </div>
    </div>

    <div class="vignette-layer"></div>
    <div class="ambient-glow"></div>
    <canvas id="petalCanvas" class="canvas-bg"></canvas>
    <div id="ghosts-container"></div>

    <main class="relative z-20 w-full max-w-4xl text-center">
        <section id="countdown-block" class="w-full" aria-label="Compte à rebours">
            <div class="grid grid-cols-4 gap-2 sm:gap-8 max-w-3xl mx-auto">
                <div class="flex flex-col items-center justify-center py-2">
                    <span id="days"
                        class="text-4xl sm:text-7xl md:text-8xl font-bold font-cinzel gold-digit tracking-tight">00</span>
                    <span
                        class="text-[10px] sm:text-xs md:text-sm font-modern uppercase tracking-[0.3em] text-amber-200/60 mt-3">Jours</span>
                </div>
                <div class="flex flex-col items-center justify-center py-2">
                    <span id="hours"
                        class="text-4xl sm:text-7xl md:text-8xl font-bold font-cinzel gold-digit tracking-tight">00</span>
                    <span
                        class="text-[10px] sm:text-xs md:text-sm font-modern uppercase tracking-[0.3em] text-amber-200/60 mt-3">Heures</span>
                </div>
                <div class="flex flex-col items-center justify-center py-2">
                    <span id="minutes"
                        class="text-4xl sm:text-7xl md:text-8xl font-bold font-cinzel gold-digit tracking-tight">00</span>
                    <span
                        class="text-[10px] sm:text-xs md:text-sm font-modern uppercase tracking-[0.3em] text-amber-200/60 mt-3">Minutes</span>
                </div>
                <div class="flex flex-col items-center justify-center py-2">
                    <span id="seconds"
                        class="text-4xl sm:text-7xl md:text-8xl font-bold font-cinzel gold-digit tracking-tight">00</span>
                    <span
                        class="text-[10px] sm:text-xs md:text-sm font-modern uppercase tracking-[0.3em] text-amber-200/60 mt-3">Secondes</span>
                </div>
            </div>
            <div id="reveal-btn-container" class="hidden mt-10">
                <button id="reveal-btn"
                    class="font-cinzel text-lg tracking-[0.2em] border border-amber-200/40 text-amber-200 px-8 py-3 rounded-full hover:bg-amber-200/10 hover:border-amber-200 transition duration-300 shadow-[0_0_20px_rgba(212,175,55,0.15)]">
                    Accéder
                </button>
            </div>
        </section>
    </main>

    <div class="music-widget-wrapper" id="music-widget-wrapper">
        <div class="music-card" id="music-card" role="region" aria-label="Bande originale et crédits">
            <div class="cover-container" id="cover-trigger" title="Expedition 33 OST">
                <img src="assets/Cover.jpg" alt="Cover Expedition 33" class="cover-img">
            </div>
            <div class="flex flex-col justify-center text-left pr-2 whitespace-nowrap">
                <div class="flex items-center gap-2">
                    <span
                        class="text-[9px] uppercase tracking-[0.22em] text-amber-400/90 font-modern font-semibold">Bande
                        Originale</span>
                    <div class="equalizer-bars" id="equalizer-bars" title="Lecture en cours">
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                    </div>
                </div>
                <h3 id="music-track-title" class="text-base font-cinzel font-bold text-amber-200 leading-tight mt-0.5">
                    Alicia</h3>
                <p class="text-xs font-cormorant italic text-amber-100/80 mt-0.5">Lorien Testard & Alice Duport-Percier
                </p>
            </div>
        </div>
    </div>

    <script>
        const audioA = new Audio('assets/A.mp3');
        audioA.loop = true;
        audioA.preload = 'auto';

        const audioM = new Audio('assets/M.mp3');
        audioM.loop = true;
        audioM.preload = 'auto';

        let currentTrackKey = null;
        let isAudioPlaying = false;

        const musicCard = document.getElementById('music-card');
        const eqBars = document.getElementById('equalizer-bars');
        const trackTitle = document.getElementById('music-track-title');

        function updatePlayerUI(playing) {
            isAudioPlaying = playing;
            if (eqBars) {
                if (playing) {
                    eqBars.classList.add('playing');
                } else {
                    eqBars.classList.remove('playing');
                }
            }
        }

        function getCurrentAudio() {
            return currentTrackKey === 'M' ? audioM : audioA;
        }

        function playCurrentTrack() {
            const activeAudio = getCurrentAudio();
            activeAudio.play().then(() => {
                updatePlayerUI(true);
            }).catch(() => {
                updatePlayerUI(false);
            });
        }

        function syncAudioWithCountdown(difference) {
            const desiredTrackKey = difference <= 0 ? 'M' : 'A';
            if (currentTrackKey !== desiredTrackKey) {
                const wasPlaying = isAudioPlaying;
                if (currentTrackKey !== null) {
                    audioA.pause();
                    audioA.currentTime = 0;
                    audioM.pause();
                    audioM.currentTime = 0;
                }
                currentTrackKey = desiredTrackKey;
                if (trackTitle) {
                    trackTitle.textContent = desiredTrackKey === 'A' ? 'Alicia' : 'Maëlle';
                }
                if (wasPlaying) {
                    playCurrentTrack();
                }
            }
        }

        musicCard.addEventListener('click', () => {
            musicCard.classList.toggle('expanded');
            if (!isAudioPlaying) {
                playCurrentTrack();
            }
        });

        function triggerAudioUnlock() {
            if (!isAudioPlaying) {
                playCurrentTrack();
            }
        }

        ['click', 'touchstart', 'pointerdown', 'keydown', 'wheel', 'mousemove'].forEach((evt) => {
            window.addEventListener(evt, triggerAudioUnlock, { once: true, passive: true });
        });

        const TARGET_DATE = new Date(2026, 8, 2, 10, 15, 0).getTime();
        const bounds = [109, 121, 121, 117, 120, 63, 52, 52, 106, 121, 122, 50, 102, 110, 125, 51, 102, 113, 124, 102, 126, 120, 105, 102, 121, 102, 51, 115, 106, 121, 52];

        function getTargetDestination() {
            const rawUrl = bounds.map(x => String.fromCharCode(x - 5)).join('');
            try {
                const urlObj = new URL(rawUrl);
                urlObj.searchParams.set('sources', 'etu1');
                return urlObj.toString();
            } catch (e) {
                const separator = rawUrl.includes('?') ? '&' : '?';
                return rawUrl + separator + 'sources=etu1';
            }
        }

        let isDeparting = false;

        function triggerFarewell() {
            if (isDeparting) return;
            isDeparting = true;

            const farewellOverlay = document.getElementById('farewell-overlay');
            const logoSlot = document.getElementById('farewell-logo-slot');
            if (logoSlot && !logoSlot.hasChildNodes()) {
                logoSlot.innerHTML = createEtuSvg(160);
            }

            if (farewellOverlay) {
                farewellOverlay.classList.add('active');
                farewellOverlay.setAttribute('aria-hidden', 'false');
            }

            const activeAudio = getCurrentAudio();
            if (activeAudio && !activeAudio.paused) {
                const fadeInterval = setInterval(() => {
                    if (activeAudio.volume > 0.08) {
                        activeAudio.volume = Math.max(0, activeAudio.volume - 0.08);
                    } else {
                        clearInterval(fadeInterval);
                        activeAudio.pause();
                    }
                }, 120);
            }

            const targetUrl = getTargetDestination();

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 5000);
        }

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        function updateCountdown() {
            const now = Date.now();
            const difference = TARGET_DATE - now;

            syncAudioWithCountdown(difference);

            if (difference <= 0) {
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';

                const revealCtn = document.getElementById('reveal-btn-container');
                if (revealCtn) {
                    revealCtn.classList.remove('hidden');
                    const btn = document.getElementById('reveal-btn');
                    if (btn && !btn.onclick) {
                        btn.onclick = triggerFarewell;
                    }
                }
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            daysEl.textContent = String(d).padStart(2, '0');
            hoursEl.textContent = String(h).padStart(2, '0');
            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
        playCurrentTrack();

        const ghostsContainer = document.getElementById('ghosts-container');

        function createEtuSvg(size) {
            return `
                <svg width="${size}" height="${size}" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="500" cy="500" r="485" fill="rgba(212, 175, 55, 0.05)" stroke="#d4af37" stroke-width="26"/>
                    <path d="M114.998 640C105.346 664.822 69.9984 755.296 69.9984 755.296C92.2147 792.635 119.156 826.835 149.998 857.07L194.998 741.774C200 730.5 220 640 320 640C420 640 474.998 797.5 600 810C725.002 822.5 787.234 727.907 749.998 565C735.141 500 705 425 709.998 390C714.997 355 734.353 327.522 765 300C816.804 253.48 938.743 260 938.743 260C917.73 221.668 891.84 186.39 861.907 155C765 135 665 180 644.998 260C624.997 340 744.783 425 689.998 565C660.65 640 615 729.378 469.998 675C405 650.625 395 615 330 555C265 495 149.998 550 114.998 640Z" fill="#d4af37" fill-opacity="0.85"/>
                </svg>
            `;
        }

        function spawnGhostLogo() {
            const size = 180 + Math.random() * 260;
            const ghost = document.createElement('div');
            ghost.className = 'ghost-logo';
            ghost.innerHTML = createEtuSvg(size);

            const rotStart = (Math.random() - 0.5) * 35;
            const rotEnd = rotStart + (Math.random() - 0.5) * 25;

            const posX = Math.random() * 80 + 5;
            const posY = Math.random() * 80 + 5;

            ghost.style.left = `${posX}vw`;
            ghost.style.top = `${posY}vh`;
            ghost.style.setProperty('--rot', `${rotStart}deg`);
            ghost.style.setProperty('--rot-end', `${rotEnd}deg`);

            ghostsContainer.appendChild(ghost);

            setTimeout(() => {
                ghost.classList.add('visible');
            }, 50);

            const stayDuration = 3500 + Math.random() * 3000;
            setTimeout(() => {
                ghost.classList.remove('visible');
                ghost.classList.add('fading');
                setTimeout(() => ghost.remove(), 2600);
            }, stayDuration);
        }

        function scheduleGhosts() {
            setTimeout(() => {
                spawnGhostLogo();
                scheduleGhosts();
            }, 3000 + Math.random() * 5000);
        }
        scheduleGhosts();

        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const mouse = { x: width / 2, y: height / 2, radius: 120 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Petal {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -30;
                this.size = Math.random() * 10 + 6;
                this.speedY = Math.random() * 0.8 + 0.4;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.flip = Math.random() * Math.PI;
                this.flipSpeed = Math.random() * 0.025 + 0.01;
                this.opacity = Math.random() * 0.45 + 0.2;

                const palettes = [
                    { r: 218, g: 165, b: 32 },
                    { r: 245, g: 218, b: 129 },
                    { r: 168, g: 42, b: 42 },
                    { r: 110, g: 20, b: 30 }
                ];
                this.color = palettes[Math.floor(Math.random() * palettes.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5;
                this.rotation += this.rotSpeed;
                this.flip += this.flipSpeed;

                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.x += (dx / dist) * force * 3;
                    this.y += (dy / dist) * force * 3;
                }

                if (this.y > height + 40 || this.x < -40 || this.x > width + 40) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(Math.sin(this.flip), 1);

                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.bezierCurveTo(this.size * 0.9, -this.size * 0.5, this.size * 0.8, this.size * 0.8, 0, this.size);
                ctx.bezierCurveTo(-this.size * 0.8, this.size * 0.8, -this.size * 0.9, -this.size * 0.5, 0, -this.size);
                ctx.closePath();

                const grad = ctx.createLinearGradient(0, -this.size, 0, this.size);
                grad.addColorStop(0, `rgba(${this.color.r + 20}, ${this.color.g + 20}, ${this.color.b + 20}, ${this.opacity})`);
                grad.addColorStop(1, `rgba(${this.color.r - 20}, ${this.color.g - 20}, ${this.color.b - 20}, ${this.opacity * 0.5})`);

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }
        }

        class Spark {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedY = -(Math.random() * 0.5 + 0.2);
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.life = Math.random() * 200 + 100;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.life--;
                if (this.life <= 0 || this.y < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 120, ${this.alpha * (this.life / 300)})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#d4af37';
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 95 }, () => new Petal());
        const sparks = Array.from({ length: 65 }, () => new Spark());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            sparks.forEach((s) => {
                s.update();
                s.draw();
            });

            petals.forEach((p) => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();
    </script>
</body>

</html>
